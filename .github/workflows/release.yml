name: Release

# A version tag (v0.2.0, or v0.3.0-rc.1) builds the release files and makes a DRAFT pre-release.
# This workflow never publishes a release: the maintainer tests the draft on a pad and then
# publishes it by hand (docs/releasing.md).
# A manual run builds and packages from the selected branch. With dry_run (the default) it makes
# no attestation; it never makes a release, because a release needs a tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only: no attestation"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for what it needs. Only "package" can write.
permissions: {}

env:
  CARGO_TERM_COLOR: always

# The release jobs use no cache, so that nothing from another run can get into a release binary.
jobs:
  verify:
    name: Versions, changelog and tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -n 1)
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not <major>.<minor>.<patch>[-suffix]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      # The pad reports the firmware version as its USB release number, and the app shows its
      # own: every manifest must name the version of the release.
      - name: Every manifest has the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          for crate in protocol pad-core firmware app; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' "$crate/Cargo.toml" | head -n 1)
            if [ "$v" != "$VERSION" ]; then
              echo "::error file=$crate/Cargo.toml::$crate/Cargo.toml says $v, the release is $VERSION"
              status=1
            fi
          done
          exit $status
      - name: CHANGELOG.md has a section for the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          heading=$(grep -F "## [$VERSION]" CHANGELOG.md | head -n 1)
          if [ -z "$heading" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section '## [$VERSION]'"
            exit 1
          fi
          echo "Section: $heading"
          # A tag release needs the release date in the heading: "## [0.2.0] - 2026-11-13".
          if [ "$GITHUB_REF_TYPE" = tag ] && ! echo "$heading" | grep -Eq ' - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error file=CHANGELOG.md::the heading '$heading' has no release date"
            exit 1
          fi
          # The section text, up to the next "## [" heading and without the link definitions at the
          # end of the file, becomes the notes of the draft.
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          cat notes.md
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build-firmware:
    name: Build the firmware image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Clippy (warnings are errors)
        working-directory: firmware
        run: cargo clippy --release --locked -- -D warnings
      # --locked, paths remapped, and the image check (vector table, interrupts, size).
      - name: Build and check the image
        run: sh scripts/build-firmware.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: firmware/target/kb16-mixer-firmware.bin
          if-no-files-found: error

  build-app:
    name: Build the app
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Test
        working-directory: app
        run: cargo test --locked
      # --locked, and the build paths remapped (scripts/remap-paths.sh).
      - name: Release build
        run: sh scripts/build-app.sh
      # The runner's user name is in the path of the checkout and of the cargo folder. If the
      # remap failed, the panic locations in the exe would contain those paths.
      - name: The exe contains no build-machine path
        run: |
          if grep -aqiF 'runneradmin' app/target/release/kb16-mixer.exe; then
            echo "::error::kb16-mixer.exe contains a path of the build machine"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: app/target/release/kb16-mixer.exe
          if-no-files-found: error

  package:
    name: Package, attest and make the draft
    needs: [verify, build-firmware, build-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create (a draft only)
      id-token: write # the attestation signs with the OIDC token of this run
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build
          merge-multiple: true
      # The time of the release commit, so that a rebuild of the same commit gives the same zip.
      - name: Package
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python3 scripts/package-release.py --version "$VERSION" \
            --exe build/kb16-mixer.exe --firmware build/kb16-mixer-firmware.bin --out dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Attest the build provenance of the zip
        if: github.ref_type == 'tag' || !inputs.dry_run
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kb16-mixer-${{ needs.verify.outputs.version }}-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kb16-mixer-${{ needs.verify.outputs.version }}
          path: |
            dist/kb16-mixer-*-windows-x64.zip
            dist/SHA256SUMS
            dist/kb16-mixer.exe
            dist/kb16-mixer-firmware.bin
            build/notes.md
          if-no-files-found: error
      # A draft is visible only to people with write access. The maintainer publishes it.
      - name: Make the draft pre-release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --prerelease --title "KB16 Mixer $VERSION" --notes-file build/notes.md \
            "dist/kb16-mixer-$VERSION-windows-x64.zip" dist/SHA256SUMS
