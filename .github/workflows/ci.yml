name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: protocol
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools --target thumbv7m-none-eabi
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Format
        working-directory: firmware
        run: cargo fmt --check
      # Advisory: the firmware still has Clippy warnings, so they do not fail the job.
      - name: Clippy
        working-directory: firmware
        run: cargo clippy --release --locked
      # Builds the image with llvm-objcopy and rejects it unless the vector table and size check out.
      - name: Build and check the image
        run: sh scripts/build-firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kb16-mixer-firmware
          path: firmware/target/kb16-mixer-firmware.bin
          if-no-files-found: error

  app:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Format
        working-directory: app
        run: cargo fmt --check
      - name: Clippy
        working-directory: app
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: app
        run: cargo test --locked
      - name: Build
        run: sh scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kb16-mixer-app
          path: app/target/release/kb16-mixer.exe
          if-no-files-found: error

  # THIRD_PARTY_NOTICES.md must match what scripts/third-party-notices.py makes from the lock files.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: cargo-about
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: Notices are up to date
        run: |
          python3 scripts/third-party-notices.py
          git diff --exit-code THIRD_PARTY_NOTICES.md

  # --- Firmware hardening: host tests of the firmware logic, strict firmware lints ---------------
  # The toolchain comes from rust-toolchain.toml at the repository root.

  # The firmware logic that needs no hardware, tested on the PC (pad-core/tests/oracle.rs and
  # pad-core/tests/rules.rs).
  pad-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pad-core
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pad-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Clippy on the firmware with every warning an error, both build profiles.
  firmware-strict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - run: cargo fmt --check
      - run: cargo clippy --release --locked -- -D warnings
      - run: cargo clippy --locked -- -D warnings
