# Weekly update pull requests for the four Rust crates and for the GitHub Actions.
# Updates wait 14 days after a release (cooldown), so that a bad release can be pulled first.
# A Cargo update can change THIRD_PARTY_NOTICES.md: then the "notices" job of CI fails until
# somebody runs `python scripts/third-party-notices.py` on the branch of the pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /protocol
      - /pad-core
      - /firmware
      - /app
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
