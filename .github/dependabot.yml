# Weekly update pull requests for the GitHub Actions only.
# The crates get no Dependabot updates: an update changes THIRD_PARTY_NOTICES.md (the "notices"
# job fails until somebody runs scripts/third-party-notices.py), and a firmware crate update can
# need a newer Rust than the one in rust-toolchain.toml. `cargo deny` in CI reports advisories;
# a maintainer updates the crates by hand (see docs/testing.md, "Dependency check").
# Updates wait 14 days after a release (cooldown), so that a bad release can be pulled first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
