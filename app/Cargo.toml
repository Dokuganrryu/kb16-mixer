[package]
name = "kb16-mixer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
hidapi = "2.6.7"
kb16-mixer-protocol = { path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[build-dependencies]
embed-manifest = "1.5.1"
